<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>云散星繁的小站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3ede1; --paper-2:#ece4d4; --ink:#1a1712; --ink-2:#6b6354; --rule:#1a1712;
    --accent:#b3391f; --accent-2:#2f5d50;
    --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
    --sans:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
    --surface:#fbf7ef; --surface-2:#ece4d4;
    --overlay:rgba(26,23,18,.55);
    --dot:rgba(0,0,0,.02);
    --shadow:0 10px 40px rgba(26,23,18,.18);
    --radius:4px;
    --maxw:1080px;
  }
  body.dark-mode{
    --paper:#15120d; --paper-2:#1d1913; --ink:#ede7da; --ink-2:#a59b88; --rule:#cdbfa6;
    --accent:#e0654a; --accent-2:#6fae9c;
    --surface:#1d1913; --surface-2:#251f17;
    --overlay:rgba(0,0,0,.66);
    --dot:rgba(255,255,255,.025);
    --shadow:0 10px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.65;
    background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:4px 4px;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  button{font-family:inherit;cursor:pointer}

  /* 统一描边图标 */
  .icon{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:0 0 auto}
  .icon-sm{width:16px;height:16px}
  .icon-lg{width:24px;height:24px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

  /* ===== 刊头 ===== */
  .masthead{border-bottom:3px double var(--rule);padding:34px 0 18px;margin-bottom:6px}
  .masthead .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:14px}
  .masthead h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,8vw,86px);line-height:.92;letter-spacing:-.01em}
  .masthead .sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-2);margin-top:6px}

  /* ===== 头版: 主稿 + 侧栏 ===== */
  .lead{display:grid;grid-template-columns:1.6fr .9fr;gap:34px;padding:30px 0;border-bottom:1px solid var(--rule)}
  .lead .headline{font-family:var(--serif);font-weight:900;font-size:clamp(30px,4.4vw,52px);line-height:1.04;letter-spacing:-.01em;margin-bottom:14px}
  .lead .cover{width:100%;aspect-ratio:16/10;background-size:cover;background-position:center;border:1px solid var(--rule);margin:18px 0}
  .lead .body{column-count:2;column-gap:26px;font-family:var(--serif);font-size:15.5px;text-align:justify}
  .lead .body p{margin-bottom:12px}
  .lead .body h2{column-span:all}
  .lead .body p:first-of-type::first-letter{float:left;font-family:var(--serif);font-weight:900;font-size:64px;line-height:.8;padding:6px 10px 0 0;color:var(--accent)}
  .pull{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.4;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);
    padding:14px 0;margin:16px 0;color:var(--accent);break-inside:avoid}

  /* ===== 侧栏 ===== */
  .side .box{border:1px solid var(--rule);padding:16px;margin-bottom:18px}
  .side h3{font-family:var(--serif);font-size:15px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:12px}
  .side .now{display:flex;align-items:center;gap:12px;padding:8px 0}
  .side .now img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--rule)}
  .side .now b{font-size:14px;font-weight:600}.side .now span{display:block;font-size:12px;color:var(--ink-2)}
  .side .tag{display:inline-block;font-size:11px;padding:3px 9px;border:1px solid var(--rule);margin:0 5px 6px 0;cursor:default}
  .tag-cloud{line-height:1}

  /* ===== 文章索引(报纸格) ===== */
  .index{border-bottom:1px solid var(--rule);padding:26px 0}
  .index .h,.timeline-sec .h,.letters .h{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .art{border-top:2px solid var(--rule);padding-top:12px;cursor:pointer;transition:opacity .15s ease}
  .art:hover{opacity:.78}
  .art img{width:100%;aspect-ratio:3/2;object-fit:cover;filter:grayscale(.15);border:1px solid var(--rule)}
  .art .k{font-size:11px;letter-spacing:1px;color:var(--accent);font-weight:700;text-transform:uppercase}
  .art h4{font-family:var(--serif);font-size:19px;line-height:1.2;margin:6px 0}
  .art p{font-size:13.5px;color:var(--ink-2)}

  /* ===== 时间线(说说) ===== */
  .timeline-sec{padding:26px 0;border-bottom:1px solid var(--rule)}
  .tl{display:grid;grid-template-columns:120px 1fr;gap:16px;border-top:1px solid var(--rule);padding:14px 0}
  .tl .d{font-family:var(--serif);font-weight:700;color:var(--accent-2)}
  .tl p{font-family:var(--serif);font-size:16px}

  /* ===== 读者来信 ===== */
  .letters{padding:26px 0 50px}
  .letter{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--rule)}
  .letter img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid var(--rule)}
  .letter .who{font-weight:700;font-size:14px}
  .letter .who span{font-weight:400;color:var(--ink-2);font-size:12px;margin-left:8px}
  .letter p{font-family:var(--serif);font-size:15px;margin-top:3px}
  .letter p.collapsed{max-height:3.2em;overflow:hidden}
  .message-expand-btn{margin-top:6px;font-size:12px;color:var(--accent);background:none;border:none;padding:0;letter-spacing:1px}

  .colophon{border-top:3px double var(--rule);padding:18px 0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-2);text-align:center;cursor:default;user-select:none}

  .empty-note{color:var(--ink-2);text-align:center;padding:24px 0;font-size:13px}

  /* ===== 浮动控件 ===== */
  .ctl-btn{position:fixed;z-index:40;display:flex;align-items:center;justify-content:center;width:44px;height:44px;
    border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:50%;box-shadow:var(--shadow);
    opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s ease,visibility .2s ease,transform .2s ease,background-color .15s ease}
  .ctl-btn:hover{background:var(--surface-2)}
  .ctl-btn.show{opacity:1;visibility:visible;transform:translateY(0)}
  .theme-toggle{right:20px;bottom:84px}
  .back-to-top{right:20px;bottom:32px}
  .admin-fab{left:20px;bottom:32px}

  /* ===== 云状态 / Toast / 欢迎 ===== */
  .cloud-status{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:60;
    padding:8px 16px;font-size:13px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;
    box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease,transform .2s ease;pointer-events:none}
  .cloud-status.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .cloud-status.loading{color:var(--accent)}
  .cloud-status.success{border-color:var(--accent-2);color:var(--accent-2)}
  .cloud-status.error{color:var(--accent)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);z-index:60;
    padding:10px 18px;font-size:14px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:8px;
    box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease,transform .2s ease}
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .toast.success{border-color:var(--accent-2);color:var(--accent-2)}
  .toast.warning{border-color:var(--accent);color:var(--accent)}
  .toast.error{border-color:var(--accent);color:var(--accent)}
  .welcome-toast{position:fixed;top:18px;right:18px;z-index:60;max-width:280px;padding:12px 16px;font-size:14px;font-weight:600;
    border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);
    opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .25s ease,visibility .25s ease,transform .25s ease}
  .welcome-toast.show{opacity:1;visibility:visible;transform:translateY(0)}

  /* ===== 弹窗通用 ===== */
  .modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
    background:var(--overlay);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}
  .modal-overlay.active{opacity:1;visibility:visible}
  .modal-content{width:100%;max-width:760px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--ink);
    border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);
    transform:translateY(10px) scale(.99);transition:transform .2s ease;display:flex;flex-direction:column}
  .modal-overlay.active .modal-content{transform:translateY(0) scale(1)}
  .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-title{font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.5px}
  .modal-close{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:50%}
  .modal-close:hover{background:var(--surface-2)}
  .modal-body{padding:18px 20px}

  /* ===== 设置分页签 ===== */
  .tab-bar{display:flex;flex-wrap:wrap;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--rule);position:sticky;top:67px;background:var(--surface);z-index:1}
  .tab-btn{padding:8px 12px;font-size:13px;border:none;background:none;color:var(--ink-2);border-bottom:2px solid transparent}
  .tab-btn:hover{color:var(--ink)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tab-panel{display:none;padding:18px 20px}
  .tab-panel.active{display:block}

  /* ===== 表单 ===== */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);
    background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);transition:border-color .15s ease,box-shadow .15s ease}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
  .field textarea{resize:vertical;min-height:64px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--paper);background:var(--ink);border:1px solid var(--ink);border-radius:var(--radius);transition:opacity .15s ease}
  .btn:hover{opacity:.85}
  .btn-ghost{color:var(--ink);background:none;border:1px solid var(--rule)}
  .btn-ghost:hover{background:var(--surface-2);opacity:1}
  .btn-accent{color:var(--paper);background:var(--accent);border-color:var(--accent)}
  .btn-add{margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:13px;color:var(--ink);background:none;border:1px dashed var(--rule);border-radius:var(--radius)}
  .btn-add:hover{background:var(--surface-2)}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
  .section-label{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.5px;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}

  /* ===== 编辑器条目 ===== */
  .interest-input-item{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:12px;margin-bottom:12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper)}
  .interest-input-item.locked{opacity:.96}
  .setting-interest-img-wrap{width:96px;height:72px;overflow:hidden;border:1px solid var(--rule);background:var(--surface-2)}
  .setting-interest-img{width:100%;height:100%;object-fit:cover}
  .interest-item-content{display:flex;flex-direction:column;gap:8px}
  .interest-item-content input,.interest-item-content textarea{width:100%;padding:7px 9px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}
  .interest-item-content input:focus,.interest-item-content textarea:focus{outline:none;border-color:var(--accent)}
  .interest-item-content textarea{resize:vertical;min-height:54px}
  .item-actions{display:flex;flex-direction:column;gap:6px}
  .item-lock-btn,.item-delete-btn,.item-sticky-btn{display:flex;align-items:center;justify-content:center;gap:4px;min-width:34px;height:32px;padding:0 8px;font-size:12px;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:var(--radius)}
  .item-lock-btn:hover,.item-delete-btn:hover{background:var(--surface-2)}
  .item-delete-btn{color:var(--accent)}
  .item-sticky-btn.active{color:var(--paper);background:var(--accent);border-color:var(--accent)}
  .item-image-url-label,.game-remark-input-wrap>span,.game-screenshots-input-header>span{font-size:12px;color:var(--ink-2)}
  .game-screenshots-input-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .screenshot-input-item{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
  .screenshot-input-item input{padding:6px 8px;font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}
  .screenshot-delete-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:none;border:1px solid var(--rule);border-radius:var(--radius)}
  .tag-item-content,.moment-item-content{gap:8px}

  /* 头像组 */
  #avatarGroup{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
  #avatarGroup .avatar-preview{width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);flex:0 0 auto}
  #avatarGroup.avatar-locked .avatar-preview{filter:grayscale(.2)}
  #lockAvatar{font-size:12px}

  /* 好友留言管理 */
  .friend-message-admin-item{border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
  .friend-message-admin-header{display:flex;justify-content:space-between;gap:8px;font-size:13px}
  .friend-message-admin-nick{font-weight:700}
  .friend-message-admin-time{color:var(--ink-2);font-size:12px}
  .friend-message-admin-content{font-size:13px;margin:6px 0 8px;font-family:var(--serif)}
  .friend-message-delete-btn{font-size:12px;color:var(--accent);background:none;border:1px solid var(--rule);border-radius:var(--radius);padding:4px 10px}

  /* 文章详情 */
  .post-detail-cover{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;border:1px solid var(--rule);border-radius:8px}
  .post-detail-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);margin:12px 0}
  .post-detail-title{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.2;margin-bottom:10px}
  .post-detail-content p{margin-bottom:12px;font-family:var(--serif);font-size:15.5px}
  .post-detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .post-tag{font-size:12px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px}

  /* 游戏截图 */
  .game-screenshots-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .game-screenshot-item{border:1px solid var(--rule);border-radius:8px;overflow:hidden;cursor:pointer}
  .game-screenshot-item img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .game-screenshots-title{font-family:var(--serif);font-weight:700;font-size:16px}

  /* 图片查看器 */
  .image-viewer-content{max-width:92vw;max-height:88vh}
  .image-viewer-img{max-width:100%;max-height:84vh;display:block;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2)}

  /* 好友码弹窗 */
  .friend-code-modal-body{padding:20px;text-align:center}
  .friend-code-modal-body .field{text-align:left;max-width:360px;margin:0 auto 14px}
  .friend-code-modal-body .btn{width:100%;justify-content:center;max-width:360px;margin:0 auto}

  /* 裁剪弹窗 */
  #cropImage{display:block;max-width:100%;max-height:60vh}
  .crop-actions{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--rule)}

  /* ===== 响应式 ===== */
  @media (max-width:980px){
    .lead{grid-template-columns:1fr}
    .lead .body{column-count:1}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .wrap{padding:0 18px}
    .grid{grid-template-columns:1fr}
    .tl{grid-template-columns:80px 1fr}
    .interest-input-item{grid-template-columns:1fr;gap:10px}
    .setting-interest-img-wrap{width:100%;height:140px}
    .item-actions{flex-direction:row;flex-wrap:wrap}
    .field-row{grid-template-columns:1fr}
    .game-screenshots-grid{grid-template-columns:1fr}
    .masthead h1{font-size:clamp(34px,11vw,56px)}
  }
  @media (max-width:400px){
    .wrap{padding:0 14px}
    .ctl-btn{width:40px;height:40px}
    .theme-toggle{bottom:76px}
    .modal-overlay{padding:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
    .ctl-btn,.modal-overlay,.modal-content,.toast,.cloud-status,.welcome-toast{transform:none!important}
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- 刊头 -->
    <header class="masthead">
      <div class="meta">
        <span>第 1 期</span>
        <span id="mastAuthor">云散星繁 著</span>
        <span id="mastDate">2026 年 8 月</span>
      </div>
      <h1 id="heroTitle">云散星繁的小站</h1>
      <div class="sub" id="heroSubtitle">记录生活，分享热爱</div>
    </header>

    <!-- 头版 -->
    <article class="lead">
      <div>
        <div class="cover" id="heroBg"></div>
        <div class="body" id="leadBody"></div>
      </div>
      <aside class="side">
        <div id="interestsContainer"></div>
        <div class="box">
          <h3>标签云</h3>
          <div id="profileTags" class="tag-cloud"></div>
        </div>
        <div class="box">
          <h3>关于笔者</h3>
          <div class="now">
            <div>
              <b id="sidebarName">云散星繁</b>
              <span id="sidebarTitle">日漫爱好者 / 开放世界二游玩家</span>
            </div>
          </div>
        </div>
      </aside>
    </article>

    <!-- 文章索引 -->
    <section class="index">
      <div class="h" id="postsSubtitle">更多文章</div>
      <div class="grid" id="postsList"></div>
    </section>

    <!-- 说说时间线 -->
    <section class="timeline-sec">
      <div class="h" id="momentsSubtitle">近期说说</div>
      <div id="momentsList"></div>
    </section>

    <!-- 读者来信 -->
    <section class="letters">
      <div class="h">友邻来信</div>
      <div id="friendMessagesList"></div>
    </section>

    <footer class="colophon" id="footerText">云散星繁的小站 · 由静态前端与云数据库手工排印</footer>
  </div>

  <!-- 浮动控件 -->
  <button type="button" class="ctl-btn theme-toggle" id="themeToggle" title="切换深浅色" aria-label="切换深浅色">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

  // ============ 工具函数 ============
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function showToast(msg, type = 'info') {
    clearTimeout(toastTimer);
    dom.toast.className = 'toast ' + type;
    dom.toast.textContent = msg;
    requestAnimationFrame(() => {
      dom.toast.classList.add('show');
      toastTimer = setTimeout(() => dom.toast.classList.remove('show'), 2500);
    });
  }
  function showCloudStatus(type, text) {
    dom.cloudStatus.className = 'cloud-status ' + type + ' show';

      setTimeout(() => dom.cloudStatus.classList.remove('show'), 3000);

  // ============ 存储 ============
  function migrateConfig(config) {
    const merged = Object.assign({}, defaultConfig, config);
    if (merged.interests && merged.interests.game) {
      merged.interests.game = merged.interests.game.map(item => {
        if (!item.remark) item.remark = '';
        if (!item.image && item.screenshots && item.screenshots.length > 0) item.image = item.screenshots[0];
        return item;
      });
    }
    if (!merged.friendCodes) merged.friendCodes = defaultConfig.friendCodes || [];
    if (!merged.friendMessages) merged.friendMessages = defaultConfig.friendMessages || [];
    return merged;
  }
  function loadLocalConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        return migrateConfig(saved);
      }
    } catch (e) { console.warn('读取本地配置失败', e); }
    return Object.assign({}, defaultConfig);
  }
  function saveLocalConfig(config) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      return true;
    } catch (e) {
      console.error('保存本地配置失败', e);
      return false;
    }
  }

  // ============ 云端 ============
  async function loadFromCloud() {
    if (!CONFIG.BIN_ID) return null;
    try {
      showCloudStatus('loading', '正在从云端同步...');
      const resp = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}/latest`, {
        headers: { 'X-Master-Key': CONFIG.API_KEY }
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const config = migrateConfig(data.record);
      saveLocalConfig(config);
      cloudSynced = true;
      showCloudStatus('success', '云端同步成功');
      return config;
    } catch (e) {
      console.warn('云端加载失败', e);
      showCloudStatus('error', '云端同步失败');
      return null;
    }
  }
  async function saveToCloud(config) {
    if (!CONFIG.BIN_ID) return;
    try {
      showCloudStatus('loading', '正在保存到云端...');
      const resp = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.API_KEY },
        body: JSON.stringify(config)
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      showCloudStatus('success', '云端保存成功');
    } catch (e) {
      console.error('云端保存失败', e);
      showCloudStatus('error', '云端保存失败');
      showToast('云端保存失败，请检查网络', 'error');
    }
  }

  // ============ 解析函数 ============
  function collectInterestData() {
    const result = {};
    ['music', 'anime', 'game'].forEach(cat => {
      const list = $(cat + 'List');
      if (!list) { result[cat] = []; return; }
      const items = list.querySelectorAll('.interest-input-item');
      const isGame = cat === 'game';
      result[cat] = Array.from(items).map(item => {
        const obj = {
          title: item.querySelector('.item-title-input').value.trim(),
          image: item.querySelector('.item-img').dataset.src || ''
        };
        if (isGame) {
          const ssInputs = item.querySelectorAll('.screenshot-url-input');
          obj.screenshots = Array.from(ssInputs).map(input => input.value.trim()).filter(v => v);
          const remarkInput = item.querySelector('.item-remark-input');
          obj.remark = remarkInput ? remarkInput.value.trim() : '';
        } else {
          const urlInput = item.querySelector('.item-url-input');
          obj.url = urlInput ? urlInput.value.trim() : '';
        }
        return obj;
      });
    });
    return result;
  }
  function collectPostsData() {
    const list = $('postsSettingsList');
    if (!list) return [];
    const items = list.querySelectorAll('.interest-input-item');
    return Array.from(items).map(item => {
      const tagsInput = item.querySelector('.item-tags-input');
      const tags = tagsInput ? tagsInput.value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 3) : [];
      return {
        title: item.querySelector('.item-title-input').value.trim(),
        cover: item.querySelector('.item-img').dataset.src || '',
        url: item.querySelector('.item-url-input').value.trim() || '#',
        excerpt: item.querySelector('.item-excerpt-input').value.trim(),
        tags: tags,
        date: item.querySelector('.item-date-input').value.trim(),
        content: item.querySelector('.item-content-input').value.trim(),
        sticky: item.dataset.sticky === '1'
      };
    }).filter(item => item.title || item.url !== '#');
  }
  function collectMomentsData() {
    const list = $('momentsSettingsList');
    if (!list) return [];
    const items = list.querySelectorAll('.interest-input-item');
    return Array.from(items).map(item => ({
      content: item.querySelector('.item-moment-content-input').value.trim(),
      date: item.querySelector('.item-moment-date-input').value.trim()
    })).filter(item => item.content);
  }
  function collectTagsData() {
    const list = $('tagsList');
    if (!list) return [];
    const items = list.querySelectorAll('.interest-input-item');
    return Array.from(items).map(item => {
      const name = item.querySelector('.item-tag-name-input').value.trim();
      const value = item.querySelector('.item-tag-value-input').value.trim();
      return name && value ? name + ': ' + value : value || name;
    }).filter(Boolean);
  }
  function collectFriendCodesData() {
    const list = $('friendCodesList');
    if (!list) return [];
    const items = list.querySelectorAll('.friend-code-input-item');
    return Array.from(items).map(item => {
      const codeInput = item.querySelector('.friend-code-input');
      const nickInput = item.querySelector('.friend-nick-input');
      return {
        code: codeInput ? codeInput.value.trim() : '',
        nickname: nickInput ? nickInput.value.trim() : ''
      };
    }).filter(item => item.code && item.nickname);
  }

  // ============ 保存（继承 currentConfig，旧字段非破坏保留） ============
  async function handleSave() {
    const currentConfig = loadLocalConfig();
    const avatarLocked = dom.avatarGroup && dom.avatarGroup.classList.contains('avatar-locked');
    let avatarVal;
    if (avatarLocked) {
      avatarVal = currentConfig.avatar || defaultConfig.avatar;
    } else {
      avatarVal = (dom.inputAvatar && dom.inputAvatar.value.trim()) || currentConfig.avatar || defaultConfig.avatar;
    }
    const config = Object.assign({}, currentConfig);
    config.siteName = (dom.inputSiteName && dom.inputSiteName.value.trim()) || defaultConfig.siteName;
    config.heroTitle = (dom.inputHeroTitle && dom.inputHeroTitle.value.trim()) || defaultConfig.heroTitle;
    config.heroSubtitle = (dom.inputHeroSubtitle && dom.inputHeroSubtitle.value.trim()) || defaultConfig.heroSubtitle;
    config.heroBg = (dom.inputHeroBg && dom.inputHeroBg.value.trim()) || defaultConfig.heroBg;
    config.avatar = avatarVal;
    config.name = (dom.inputName && dom.inputName.value.trim()) || defaultConfig.name;
    config.title = (dom.inputTitle && dom.inputTitle.value.trim()) || defaultConfig.title;
    config.bio = (dom.inputBio && dom.inputBio.value.trim()) || defaultConfig.bio;
    config.postsSubtitle = (dom.inputPostsSubtitle && dom.inputPostsSubtitle.value.trim()) || defaultConfig.postsSubtitle;
    config.momentsSubtitle = (dom.inputMomentsSubtitle && dom.inputMomentsSubtitle.value.trim()) || defaultConfig.momentsSubtitle;
    config.interestsSubtitle = (dom.inputInterestsSubtitle && dom.inputInterestsSubtitle.value.trim()) || defaultConfig.interestsSubtitle;
    config.posts = collectPostsData();
    config.moments = collectMomentsData();
    config.tags = collectTagsData();
    config.interests = collectInterestData();
    config.friendCodes = collectFriendCodesData();
    config.friendMessages = currentConfig.friendMessages || defaultConfig.friendMessages || [];
    config.footer = (dom.inputFooter && dom.inputFooter.value.trim()) || defaultConfig.footer;
    // nav / notice / startDate / views 等旧字段由 currentConfig 原样保留

    if (saveLocalConfig(config)) {
      lastRenderedJson = '';
      renderConfig(config);
      closeModal();
      showToast('已保存到本地', 'success');
      if (isAdminMode && CONFIG.BIN_ID) await saveToCloud(config);
    } else {
      showToast('保存失败', 'error');
    }
  }

    if (!dom.welcomeToast || !dom.welcomeText) return;
    const hour = new Date().getHours();
    let greeting = '你好';
    if (hour >= 5 && hour < 9) greeting = '早上好';
    else if (hour >= 9 && hour < 12) greeting = '上午好';
    else if (hour >= 12 && hour < 14) greeting = '中午好';
    else if (hour >= 14 && hour < 18) greeting = '下午好';
    else greeting = '晚上好';
    dom.welcomeText.textContent = greeting + '，' + nickname;

    const reader = new FileReader();

    dom.fileInput.value = '';
  });

  function openCropModal(imageDataUrl) {
    if (dom.cropImage) dom.cropImage.src = imageDataUrl;
    dom.cropModal.classList.add('active');
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      if (typeof Cropper === 'undefined') {
        showToast('裁剪库加载失败，直接使用原图', 'warning');
        if (dom.inputAvatar) dom.inputAvatar.value = imageDataUrl;
        if (dom.avatarPreview) dom.avatarPreview.src = imageDataUrl;
        dom.cropModal.classList.remove('active');
        return;
      }
      if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
      cropperInstance = new Cropper(dom.cropImage, {
        aspectRatio: 1, viewMode: 1, dragMode: 'move', autoCropArea: 0.8, responsive: true, background: false
      });
    }, 100);
  }
  function closeCropModal() {
    dom.cropModal.classList.remove('active');

  }

  if (dom.confirmCropBtn) dom.confirmCropBtn.addEventListener('click', () => {
    if (!cropperInstance) return;
    const canvas = cropperInstance.getCroppedCanvas({ width: AVATAR_SIZE, height: AVATAR_SIZE, imageSmoothingQuality: 'high' });
    if (!canvas) { showToast('裁剪失败，请重试或更换图片', 'error'); return; }
    let dataUrl = canvas.toDataURL('image/jpeg', AVATAR_QUALITY);
    const sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);
    if (sizeKB > 500) dataUrl = canvas.toDataURL('image/jpeg', 0.6);
    if (dom.inputAvatar) dom.inputAvatar.value = dataUrl;
    if (dom.avatarPreview) dom.avatarPreview.src = dataUrl;
    closeCropModal();
    showToast('头像已裁剪（约 ' + Math.round((dataUrl.length * 3) / 4 / 1024) + 'KB）', 'success');

      </div>
      <div class="item-actions">
        <button type="button" class="item-lock-btn" onclick="toggleItemLock(this)" title="锁定/解锁">${icon('lock', 16)}</button>
        <button type="button" class="item-delete-btn" onclick="deleteInterestItem(this, '${category}')" title="删除">${icon('x', 16)}</button>
      </div>`;
    list.appendChild(item);
    if (isGame) {
      const ssList = item.querySelector('.game-screenshots-input-list');
      addScreenshotItem(ssList);
    }
    if (!silent) showToast('已添加' + getCategoryName(category) + '条目（默认锁定）', 'success');
  };
  function addScreenshotItem(list, value) {
    if (!list) return;
    const item = document.createElement('div');
    item.className = 'screenshot-input-item';
    item.innerHTML = `<input type="url" class="screenshot-url-input" placeholder="截图链接 https://..." value="${value || ''}"><button type="button" class="screenshot-delete-btn" onclick="this.parentElement.remove()" title="删除">${icon('minus', 16)}</button>`;
    list.appendChild(item);
  }
  window.addScreenshotInput = function(btn) {
    const list = btn.closest('.game-screenshots-input-wrap').querySelector('.game-screenshots-input-list');
    addScreenshotItem(list);
  };
  window.deleteInterestItem = function(btn) { btn.closest('.interest-input-item').remove(); showToast('已删除', 'info'); };
  window.updateItemImagePreview = function(inputEl) {
    const item = inputEl.closest('.interest-input-item');
    const img = item.querySelector('.item-img');
    const url = inputEl.value.trim();
    if (url) { img.src = url; img.dataset.src = url; }
    else { img.src = FALLBACK_IMG; img.dataset.src = ''; }
  };

  // ============ 回到顶部 ============
  function initBackToTop() {
    dom.backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) dom.backToTop.classList.add('show');
      else dom.backToTop.classList.remove('show');
    }, { passive: true });
  }

  // ============ 初始化 ============
  async function init() {
    const localCfg = loadLocalConfig();
    renderConfig(localCfg);
    fillForm(localCfg);
    initBackToTop();

    if (dom.footerText) {
      let footerClicks = 0, footerTimer = null;
      dom.footerText.addEventListener('click', () => {
        if (isAdminMode) return;
        footerClicks++;
        clearTimeout(footerTimer);
        footerTimer = setTimeout(() => footerClicks = 0, 1500);
        if (footerClicks >= 10) { footerClicks = 0; checkAdminMode(); }
      });
    }

    if (!isAdminMode && CONFIG.BIN_ID && CONFIG.API_KEY) {
      const cloudCfg = await loadFromCloud();
      if (cloudCfg) { lastRenderedJson = ''; renderConfig(cloudCfg); }
    }
  }

  // 检测管理员密码快捷键（连按 5 次 Shift）
  let shiftCount = 0, shiftTimer = null;
  document.addEventListener('keydown', e => {
    if (e.key === 'Shift') {
      shiftCount++;
      clearTimeout(shiftTimer);
      shiftTimer = setTimeout(() => shiftCount = 0, 1500);
      if (shiftCount >= 5 && !isAdminMode) { shiftCount = 0; checkAdminMode(); }
    }
  });

  // 支持通过 ?admin 直接进入管理登录
  if (/[?&]admin\b/.test(location.search)) checkAdminMode();

  init();
});
</script>
</body>
</html>
